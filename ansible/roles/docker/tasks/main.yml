---
- name: Install docker.io
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
  notify: Restart docker

- name: Collect local users
  ansible.builtin.getent:
    database: passwd

- name: Fail if docker_user does not exist
  ansible.builtin.fail:
    msg: "User {{ docker_user }} does not exist on the target host. Create it first, e.g. with the users role."
  when: docker_user not in getent_passwd

- name: Add docker_user to docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: Enable and start docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
