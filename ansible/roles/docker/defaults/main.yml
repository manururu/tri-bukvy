---
# Пользователь, добавляемый в группу docker.
# По умолчанию — ansible_deploy_user из inventory (ci),
# от имени которого плейбуки запускаются из GitHub Actions.
docker_user: "{{ ansible_deploy_user | default('ci') }}"

# Архитектура в терминах dpkg (amd64/arm64), ansible_architecture отдаёт x86_64/aarch64.
docker_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, ansible_architecture) }}"

# Официальный apt-репозиторий Docker для Debian.
docker_repo_url: "https://download.docker.com/linux/debian"
docker_gpg_key_url: "https://download.docker.com/linux/debian/gpg"
