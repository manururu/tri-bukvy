---
name: "[ANSIBLE] Deploy"
run-name: "[ANSIBLE] deploy – ${{ inputs.playbook }}"

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: Playbook to run
        required: true
        type: choice
        options:
          - SETUP
          - users
          - basics
          - docker
          - xray

      hosts:
        description: Host group or pattern to run on (e.g. web, vpn, all). Leave empty
          to use the playbook's hosts
        required: false
        type: string
        default: ''

      tags:
        description: 'Ansible tags to run. For xray: "links" renders client configs
          and uploads them as a job artifact instead of deploying. Leave empty to run
          the whole playbook'
        required: false
        type: string
        default: ''

jobs:
  deploy-playbook:
    name: Run playbook – ${{ inputs.playbook }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible passlib

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Write vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Install sshpass
        if: inputs.playbook == 'SETUP'
        run: sudo apt-get install -y --no-install-recommends sshpass

      - name: Add deploy SSH key to agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.COMMON_DEPLOY_SSH_KEY }}

      - name: Run playbook
        env:
          HOSTS_LIMIT: ${{ inputs.hosts }}
          TAGS: ${{ inputs.tags }}
        run: ansible-playbook playbooks/${{ inputs.playbook }}.yml
          ${HOSTS_LIMIT:+--limit "$HOSTS_LIMIT"}
          ${TAGS:+--tags "$TAGS"}

      # Роль xray рендерит клиентские ссылки в ansible/out/ на самом раннере,
      # поэтому без выгрузки они исчезнут вместе с ним. В ссылках рабочие ключи
      # доступа, а артефакт может скачать любой с правом чтения репозитория —
      # поэтому наружу уходит только симметрично зашифрованный архив, а
      # открытые файлы удаляются здесь же.
      # Расшифровать: gpg -d xray-client-links.tar.gz.gpg | tar -xzf -
      - name: Encrypt rendered client configs
        if: inputs.playbook == 'xray' && contains(inputs.tags, 'links')
        env:
          PASSPHRASE: ${{ secrets.ANSIBLE_XRAY_LINKS_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "Не задан секрет ANSIBLE_XRAY_LINKS_PASSPHRASE — без него артефакт не зашифровать"
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/links.tar.gz" -C out .
          rm -rf out && mkdir -p out
          printf '%s' "$PASSPHRASE" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output out/xray-client-links.tar.gz.gpg "$RUNNER_TEMP/links.tar.gz"
          rm -f "$RUNNER_TEMP/links.tar.gz"

      - name: Upload encrypted client configs
        if: inputs.playbook == 'xray' && contains(inputs.tags, 'links')
        uses: actions/upload-artifact@v4
        with:
          name: xray-client-links
          path: ansible/out/xray-client-links.tar.gz.gpg
          retention-days: 1
          if-no-files-found: error

      - name: Remove vault password file
        if: always()
        run: rm -f .vault_pass
